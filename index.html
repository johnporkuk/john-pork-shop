<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Pork Shop - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFD93D 25%, #6BCB77 50%, #4D96FF 75%, #FF6B9D 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 40px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        header h1 {
            font-size: 42px;
            background: linear-gradient(135deg, #FF6B6B, #FFD93D, #6BCB77, #4D96FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h2 {
            font-size: 56px;
            color: white;
            margin-bottom: 20px;
            font-weight: 900;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 24px;
            color: white;
            margin-bottom: 50px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .main-image {
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            margin-bottom: 50px;
            border: 8px solid white;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .signup-section {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 4px dashed #FF6B6B;
        }

        .signup-section h3 {
            color: #FF6B6B;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 900;
        }

        .email-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .email-input input {
            flex: 1;
            padding: 14px 18px;
            border: 3px solid #FFD93D;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            font-family: inherit;
        }

        .email-input input:focus {
            outline: none;
            border-color: #FF6B6B;
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
            transform: scale(1.02);
        }

        .email-input button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #FF6B6B, #FFD93D);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
        }

        .email-input button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .email-input button:active {
            transform: scale(0.98);
        }

        .signup-section p {
            color: #666;
            font-size: 13px;
            margin: 0;
        }

        footer {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            text-align: center;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            border-top: 4px solid #FF6B6B;
        }

        .emoji {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            header {
                padding: 20px 15px;
            }

            header h1 {
                font-size: 32px;
            }

            h2 {
                font-size: 40px;
            }

            .tagline {
                font-size: 18px;
                margin-bottom: 30px;
            }

            main {
                padding: 30px 15px;
            }

            .signup-section {
                padding: 30px 20px;
            }

            .email-input {
                flex-direction: column;
            }

            .email-input button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🐷 JOHN PORK SHOP 🐷</h1>
    </header>

    <main>
        <div class="container">
            <h2>Coming Soon!</h2>
            <p class="tagline">Something absolutely hilarious is on the way... 👃</p>

            <img src="image.jpg" alt="John Pork" class="main-image">

            <div class="signup-section">
                <h3>🎉 Get Notified 🎉</h3>
                <div class="email-input">
                    <input type="email" placeholder="Your email" id="emailInput">
                    <button onclick="handleSignup()">Notify Me!</button>
                </div>
                <p>We'll let you know the moment the madness goes live.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>🐷 JOHN PORK SHOP 2026 🐷 | Peak Pork Energy Coming Soon</p>
    </footer>

    <script>
        function handleSignup() {
            const email = document.getElementById('emailInput').value;
            if (email) {
                alert('🎉 Thanks! We\'ll notify you at: ' + email);
                document.getElementById('emailInput').value = '';
            } else {
                alert('Please enter your email!');
            }
        }

        document.getElementById('emailInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleSignup();
        });
    </script>
</body>
</html>
