<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Pork Shop - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Fredoka', 'Segoe UI', sans-serif;
            background-image: url('image.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 107, 107, 0.2);
            pointer-events: none;
        }
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 40px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
            z-index: 1;
        }
        header h1 {
            font-size: 42px;
            background: linear-gradient(135deg, #FF6B6B, #FFD93D, #6BCB77, #4D96FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        header h1 img {
            height: 50px;
            border-radius: 50%;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .container { max-width: 800px; width: 100%; }
        h2 {
            font-size: 56px;
            color: white;
            margin-bottom: 20px;
            font-weight: 900;
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.4);
        }
        .tagline {
            font-size: 24px;
            color: white;
            margin-bottom: 50px;
            font-weight: 700;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
        }
        .signup-section {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border: 4px dashed #FF6B6B;
        }
        .signup-section h3 {
            color: #FF6B6B;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 900;
        }
        .email-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .email-input input {
            flex: 1;
            padding: 14px 18px;
            border: 3px solid #FFD93D;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            font-family: 'Fredoka', sans-serif;
        }
        .email-input input:focus {
            outline: none;
            border-color: #FF6B6B;
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
            transform: scale(1.02);
        }
        .email-input button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #FF6B6B, #FFD93D);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Fredoka', sans-serif;
        }
        .email-input button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .signup-section .note {
            color: #666;
            font-size: 13px;
            margin: 0;
            font-weight: 500;
        }
        .success-message {
            display: none;
            color: #6BCB77;
            font-weight: bold;
            margin-top: 15px;
        }
        footer {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            text-align: center;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            border-top: 4px solid #FF6B6B;
            position: relative;
            z-index: 1;
        }
        @media (max-width: 768px) {
            header { padding: 15px; }
            header h1 { font-size: 28px; }
            header h1 img { height: 35px; }
            h2 { font-size: 40px; }
            .tagline { font-size: 18px; margin-bottom: 30px; }
            main { padding: 30px 15px; }
            .signup-section { padding: 30px 20px; }
            .email-input { flex-direction: column; }
            .email-input button { width: 100%; }
        }
    </style>
</head>
